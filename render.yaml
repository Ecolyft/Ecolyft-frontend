# Render Blueprint — deploy backend + Postgres + frontend from GitHub
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ecolyft-db
    plan: free
    databaseName: ecolyft
    user: ecolyft

services:
  - type: web
    name: ecolyft-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecolyft-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: EcoLyft
      - key: CORS_ORIGIN
        value: "http://localhost:5173,http://localhost:5174,https://ecolyft-app.onrender.com"

  - type: web
    name: ecolyft-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
